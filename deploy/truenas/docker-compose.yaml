# AIStor Catalog UI as a TrueNAS app (TrueNAS 24.10 "Electric Eel" or later).
#
# Apps > Discover Apps > ⋮ > Install via YAML, name it "aistor-catalog-ui",
# paste this file and edit the settings at the top of `environment`.
# See deploy/truenas/README.md.
#
# The UI serves HTTPS itself. Without a certificate of your own it creates a
# self-signed one on first start (kept in the app's volume), which browsers ask
# you to accept once.

services:
  catalog-ui:
    # A release tag, so the running version is visible and upgrading is explicit:
    # Edit the app, change the tag to a newer release, and save.
    # Releases: https://github.com/arturborycki/aistore-ui/releases
    image: ghcr.io/arturborycki/aistore-ui:0.2.0
    restart: unless-stopped
    environment:
      # --- Edit these -------------------------------------------------------
      # Required. The address people type in the browser: the NAS name or IP
      # and the port below, e.g. https://truenas.local:30443
      AISTOR_UI_SERVER_PUBLIC_URL: ""
      # Other addresses of the same UI, comma separated, or leave empty.
      AISTOR_UI_SERVER_EXTRA_ORIGINS: ""
      # Required. The AIStor S3 API (not the console) as seen from the NAS,
      # e.g. http://<aistor-host>:<s3-port>
      AISTOR_UI_CLUSTER_ENDPOINT: ""
      AISTOR_UI_CLUSTER_NAME: "AIStor"
      # AIStor users who may see everyone's activity, comma separated.
      AISTOR_UI_AUTH_ADMIN_USERS: "minioadmin"
      # Semantic models (Apache Ossie): a bucket with versioning enabled.
      AISTOR_UI_SEMANTIC_ENABLED: "true"
      AISTOR_UI_SEMANTIC_BUCKET: "aistor-semantics"
      # Any other setting can be added as AISTOR_UI_<setting path>, for example
      # AISTOR_UI_SESSION_IDLE_TIMEOUT: "45m" (see the README's Configuration).

      # --- Fixed for this deployment ----------------------------------------
      AISTOR_UI_SERVER_LISTEN: ":8443"
      AISTOR_UI_SERVER_METRICS_LISTEN: ":9090" # health check
      AISTOR_UI_SERVER_TLS_SELF_SIGNED: "true"
      AISTOR_UI_SERVER_TLS_CERT_FILE: /var/lib/aistor-ui/tls/cert.pem
      AISTOR_UI_SERVER_TLS_KEY_FILE: /var/lib/aistor-ui/tls/key.pem
      # The session key is created on first start and kept in the app's volume.
      AISTOR_UI_SESSION_KEY_FILE: /var/lib/aistor-ui/session.key
      AISTOR_UI_SESSION_KEY_GENERATE: "true"
      AISTOR_UI_AUTH_BUILTIN_ENABLED: "true"
      AISTOR_UI_CLUSTER_ID: aistor
      AISTOR_UI_CLUSTER_STS_DURATION: 12h
    ports:
      - "30443:8443"
    volumes:
      - data:/var/lib/aistor-ui
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1G }

volumes:
  data:
