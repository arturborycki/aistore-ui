apiVersion: v1
kind: Service
metadata:
  name: {{ include "aistor-ui.fullname" . }}
  labels:
    {{- include "aistor-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "aistor-ui.uiSelectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
