apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aistor-ui.fullname" . }}
  labels: {{- include "aistor-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "aistor-ui.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aistor-ui.uiSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include "aistor-ui.config" . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret-values: {{ toJson .Values.secrets | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "aistor-ui.uiSelectorLabels" . | nindent 14 }}
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/aistor-ui/config.yaml"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "aistor-ui.secretName" . }}, key: redis-password, optional: true } }
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{ end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/aistor-ui/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: secrets, mountPath: /etc/aistor-ui/secrets, readOnly: true }
            {{- if or .Values.ca.existingConfigMap .Values.ca.certificates }}
            - { name: ca, mountPath: /etc/aistor-ui/ca, readOnly: true }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ include "aistor-ui.fullname" . }} }
        - name: secrets
          secret: { secretName: {{ include "aistor-ui.secretName" . }} }
        {{- if or .Values.ca.existingConfigMap .Values.ca.certificates }}
        - name: ca
          configMap: { name: {{ default (printf "%s-ca" (include "aistor-ui.fullname" .)) .Values.ca.existingConfigMap }} }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
