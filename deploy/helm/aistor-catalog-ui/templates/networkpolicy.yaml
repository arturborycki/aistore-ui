{{- if .Values.networkPolicy.enabled }}
# The UI accepts traffic on its HTTP and metrics ports and may reach DNS,
# Redis, AIStor and the identity provider only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aistor-ui.fullname" . }}
  labels: {{- include "aistor-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "aistor-ui.uiSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8080 }, { port: 9090 }]
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 6379 }]
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - { port: {{ . }} }
        {{- end }}
{{- end }}
