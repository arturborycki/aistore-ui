{{- if .Values.redis.enabled }}
# Single-instance Redis for sessions, shared rate limits and recent activity.
# Data is ephemeral: a restart signs users out (sessions are re-established at login).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aistor-ui.redisName" . }}
  labels:
    {{- include "aistor-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "aistor-ui.redisName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "aistor-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "aistor-ui.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command: [sh, -c]
          args:
            - exec redis-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no
              --maxmemory {{ .Values.redis.maxmemory }} --maxmemory-policy volatile-lru
              --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command CONFIG "" --rename-command DEBUG ""
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "aistor-ui.secretName" . }}, key: redis-password } }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'] }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 20
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aistor-ui.redisName" . }}
  labels:
    {{- include "aistor-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "aistor-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
{{- if .Values.networkPolicy.enabled }}
# Only the UI may talk to Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aistor-ui.redisName" . }}
  labels: {{- include "aistor-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aistor-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "aistor-ui.uiSelectorLabels" . | nindent 14 }}
      ports: [{ port: 6379 }]
  egress: []
{{- end }}
{{- end }}
