apiVersion: v1
kind: ConfigMap
metadata:
  name: aistor-catalog-ui
data:
  config.yaml: |
    server:
      listen: ":8080"
      metricsListen: ":9090"
      publicUrl: "https://catalog.example.com"
      trustProxy: true            # behind the ingress controller
    session:
      store: "rediss://:${REDIS_PASSWORD}@redis.aistor-catalog.svc:6379/0"
      keys:
        - id: k1
          file: /etc/aistor-ui/secrets/session-key
    auth:
      oidc:
        enabled: true
        displayName: "Company SSO"
        issuer: "https://sso.example.com/realms/aistor"
        clientId: aistor-ui
        clientSecretFile: /etc/aistor-ui/secrets/oidc-client-secret
        scopes: [openid, profile, email]
        groupsClaim: groups
        endSessionRedirect: true
      adminGroups: [catalog-admin]
    clusters:
      - id: prod
        name: "Production"
        endpoint: "https://aistor.example.com"
        region: us-east-1
        caFile: /etc/aistor-ui/ca/ca.crt
        stsDuration: 1h
    # Apache Ossie semantic models (create the bucket and enable versioning first).
    # semantic:
    #   enabled: true
    #   bucket: aistor-semantics
    #   serving: { enabled: true }   # /ossie/v1 and /ossie/mcp with OIDC bearer tokens
