apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aistor-catalog-ui-redis
spec:
  serviceName: aistor-catalog-ui-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/component: redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: [sh, -c]
          args:
            - exec redis-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no
              --maxmemory 200mb --maxmemory-policy volatile-lru
              --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command CONFIG "" --rename-command DEBUG ""
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: aistor-catalog-ui, key: redis-password } }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'] }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: aistor-catalog-ui-redis
spec:
  selector: { app.kubernetes.io/component: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
# Only the UI may talk to Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aistor-catalog-ui-redis
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: redis }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/component: ui }
      ports: [{ port: 6379 }]
  egress: []
