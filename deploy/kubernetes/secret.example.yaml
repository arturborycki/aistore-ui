# Not applied by kustomize. Create the real secret out-of-band, e.g.:
#   kubectl -n aistor-catalog create secret generic aistor-catalog-ui \
#     --from-literal=session-key="$(openssl rand -base64 32)" \
#     --from-literal=oidc-client-secret='<client secret>' \
#     --from-literal=redis-password='<redis password>'
#   kubectl -n aistor-catalog create configmap aistor-ca --from-file=ca.crt=/path/to/aistor-ca.pem
apiVersion: v1
kind: Secret
metadata:
  name: aistor-catalog-ui
type: Opaque
stringData:
  session-key: "REPLACE_WITH_openssl_rand_-base64_32"
  oidc-client-secret: "REPLACE"
  redis-password: "REPLACE"
